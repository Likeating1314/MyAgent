<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyAgent 启动诊断</title>
    <style>
      :root { color: #17202a; background: #f5f7fb; font-family: "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(560px, calc(100% - 48px)); }
      h1 { margin: 0 0 12px; font-size: 24px; letter-spacing: 0; }
      p { margin: 0 0 20px; color: #52606d; line-height: 1.6; }
      code { display: block; margin-bottom: 24px; padding: 12px; border: 1px solid #d7dee7; border-radius: 6px; background: #fff; color: #a23a35; }
      .actions { display: flex; gap: 12px; }
      button { min-height: 44px; padding: 0 18px; border: 1px solid #bcc7d4; border-radius: 6px; background: #fff; cursor: pointer; }
      button.primary { border-color: #1769aa; background: #1769aa; color: #fff; }
      button:focus-visible { outline: 3px solid #8fc7f1; outline-offset: 2px; }
      #status { margin-top: 18px; min-height: 24px; color: #52606d; }
    </style>
  </head>
  <body>
    <main>
      <h1>本地后端未能启动</h1>
      <p id="message">应用无法连接自己的本地服务。请重试；若问题持续，请重新安装应用并保留诊断代码。</p>
      <code id="code">backend_start_failed</code>
      <div class="actions">
        <button id="retry" class="primary" type="button">重试启动</button>
        <button id="quit" type="button">退出应用</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="./diagnostic.mjs"></script>
  </body>
</html>
